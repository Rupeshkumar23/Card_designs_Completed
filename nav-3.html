<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Joe's Navbar 3</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body{
            display: flex;
            justify-content: center;
        }
        nav{
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            background: #333333;
        }
        nav a{
            text-decoration: none;
            color: #8E8D93;
            font-size: 1.2rem;
            transition: all .3s ease-in-out;
        }
        nav a:hover{
            color: white;
        }
        nav a::after{
            content: '';
            height: 3px;
            width: 0%;
            background:#A3B76E;
            display: block;
            transition: all .3s ease-in-out;
        }
        nav a:hover::after{
            width: 100%;   
        }
    </style>
</head>
<body>
    <nav>
        <a href="#">Home</a>
        <a href="#">Product</a>
        <a href="#">Contact</a>
        <a href="#">Download</a>
        <a href="#">About Us</a>
    </nav>
</body>
</html>
