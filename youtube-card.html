<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Card</title>
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background-color: #f4f4f4;
  font-family: Arial, sans-serif;
}

.youtube-card {
  width: 300px;
  background-color: #ffffff;
  border: 3px solid #000000;
  padding: 30px 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  border-radius: 5px;
}

.card-icon {
  width: 60px;
  height: auto;
  fill: #000000;
  margin-bottom: 20px;
}

.card-title {
  font-size: 28px;
  font-weight: 800;
  color: #000000;
  text-transform: uppercase;
  margin-bottom: 15px;
  letter-spacing: 1px;
}

.card-description {
  font-size: 14px;
  color: #333333;
  line-height: 1.5;
  margin-bottom: 25px;
  max-width: 90%;
}

.card-button {
  display: inline-block;
  background-color: #000000;
  color: #ffffff;
  padding: 15px 70px;
  border-radius: 50px;
  text-decoration: none;
  font-size: 14px;
  font-weight: normal;
  text-transform: uppercase;
  border: none;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

.card-button:hover {
  background-color: #333333;
}
  </style>
</head>
<body>

<div class="youtube-card">
  <svg class="card-icon" viewBox="0 0 28 20" xmlns="http://www.w3.org/2000/svg">
    <path d="M27.313 3.138C27.008 1.9 26.038.925 24.813.613C22.625 0 14 0 14 0S5.375 0 3.188.613C1.963.925.992 1.9.688 3.138C0 5.375 0 10 0 10s0 4.625.688 6.863c.304 1.237 1.275 2.212 2.5 2.524C5.375 20 14 20 14 20s8.625 0 10.813-.613c1.225-.312 2.195-1.287 2.5-2.524C28 14.625 28 10 28 10s0-4.625-.687-6.862zM11.2 14V6l7.2 4-7.2 4z"/>
  </svg>

  <h2 class="card-title">YOUTUBE</h2>
  <p class="card-description">
    Lorem ipsum dolor, sit amet consectetur adipisicing elit.
  </p>
  <a href="#" class="card-button">READ MORE</a>
</div>

</body>
</html>
