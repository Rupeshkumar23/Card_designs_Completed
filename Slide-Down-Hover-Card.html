<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide-Down-Hover-Card Effect</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #333333;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 260px;
            height: 150px;
            background-color: #ffffff;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: height 0.4s ease-in-out;
        }
        .card-top {
            height: 150px;
            background-color: #ffffff;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
            z-index: 2;
            transition: background-color 0.4s ease-in-out, color 0.4s ease-in-out;
        }

        .card-title {
            margin: 0;
            font-size: 1.4em;
            font-weight: 500;
            text-align: center;
            user-select: none;
        }

        .card-bottom {
            background-color: #ffffff;
            padding: 20px;
            box-sizing: border-box;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            transform: translateY(100%);
            transition: transform 0.4s ease-in-out;
            z-index: 1;
        }

        .card-text {
            font-size: 0.9em;
            line-height: 1.5;
            color: #525252;
            margin-top: 40px;
            text-align: justify;
            margin-bottom: 10px;
        }

        .card-button {
            padding: 8px 16px;
            border: 1.5px solid #525252;
            background-color: transparent;
            color: #525252;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bolder;
            transition: background-color 0.2s ease;
        }

        .card-button:hover {
           background-color: #e0e0e0;
        }

        .card:hover {
            height: 320px;
            border-radius:5px ;
        }

        .card:hover .card-top {
            background-color: #FF1D55;
            color: #ffffff;
        }

        .card:hover .card-bottom {
            transform: translateY(0);
        }

    

    </style>
</head>
<body>
    <div class="card">
        <div class="card-top">
            <h2 class="card-title">TUTOR JOE'S</h2>
        </div>
        <div class="card-bottom">
            <p class="card-text">
                Lorem ipsum, dolor sit amet consectetur adipisicing elit.
                Optio eos tempora deleniti expedita veritatis voluptas.
            </p>
            <button class="card-button">Read More</button>
        </div>
    </div>
</body>
</html>
