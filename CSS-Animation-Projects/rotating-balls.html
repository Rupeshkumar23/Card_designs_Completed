<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rotating Balls Animation</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #ffffff;
      }

      .container {
        position: relative;
        width: 300px;
        height: 300px;
      }

      .container > div {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        animation: rotation 5s linear infinite;
        animation-delay: calc(0.15s * var(--i));
      }

      .ball {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);

        width: 2px;
        height: 2px;
        background-color: #00a814;
        border-radius: 50%;
        animation: resize 2s linear infinite;
        animation-delay: calc(0.15s * var(--i));
      }

      @keyframes rotation {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(720deg);
        }
      }

      @keyframes resize {
        0% {
          transform: scale(1) translateX(-50%);
          filter: hue-rotate(0deg);
        }
        90% {
          transform: scale(50) translateX(-50%);
          filter: hue-rotate(360deg);
        }
        100% {
          transform: scale(1) translateX(-50%);
          filter: hue-rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div style="--i: 1"><div class="ball"></div></div>
      <div style="--i: 2"><div class="ball"></div></div>
      <div style="--i: 3"><div class="ball"></div></div>
      <div style="--i: 4"><div class="ball"></div></div>
      <div style="--i: 5"><div class="ball"></div></div>
      <div style="--i: 6"><div class="ball"></div></div>
      <div style="--i: 7"><div class="ball"></div></div>
      <div style="--i: 8"><div class="ball"></div></div>
      <div style="--i: 9"><div class="ball"></div></div>
      <div style="--i: 10"><div class="ball"></div></div>
    </div>
  </body>
</html>
