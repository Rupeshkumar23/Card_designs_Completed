<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating Balls Animation</title>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff; /* White background as in the video */
        }

        .container {
            position: relative;
            width: 300px; /* Fixed size as implied by video for simplicity */
            height: 300px;
            /* border: 1px solid #ccc; /* For debugging container bounds */
        }

        .container > div { /* These are the rotating "arms" */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            animation: rotation 5s linear infinite;
            /* CSS custom property --i will be set inline in HTML */
            animation-delay: calc(0.15s * var(--i));
        }

        .ball {
            position: absolute;
            top: 0; /* Position the ball at the top of its rotating parent "arm" */
            left: 50%; /* Center horizontally within the arm */
            transform: translateX(-50%); /* Adjust for its own width to be truly centered */
            
            width: 2px; /* Initial small size of the ball */
            height: 2px;
            background-color: #00a814; /* Initial color (greenish), hue-rotate will change this */
            border-radius: 50%; /* Make it a circle */
            
            animation: resize 2s linear infinite;
            /* CSS custom property --i will be set inline in HTML, same as its parent arm */
            animation-delay: calc(0.15s * var(--i));
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(720deg); /* Two full rotations per 5s cycle */
            }
        }

        @keyframes resize {
            0% {
                transform: scale(1) translateX(-50%); /* Maintain centering while scaling */
                filter: hue-rotate(0deg);
            }
            90% {
                transform: scale(50) translateX(-50%); /* Grow significantly */
                filter: hue-rotate(360deg); /* Cycle through colors */
            }
            100% {
                transform: scale(1) translateX(-50%); /* Shrink back to initial size */
                filter: hue-rotate(360deg); /* Maintain end color briefly */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="--i: 1;"><div class="ball"></div></div>
        <div style="--i: 2;"><div class="ball"></div></div>
        <div style="--i: 3;"><div class="ball"></div></div>
        <div style="--i: 4;"><div class="ball"></div></div>
        <div style="--i: 5;"><div class="ball"></div></div>
        <div style="--i: 6;"><div class="ball"></div></div>
        <div style="--i: 7;"><div class="ball"></div></div>
        <div style="--i: 8;"><div class="ball"></div></div>
        <div style="--i: 9;"><div class="ball"></div></div>
        <div style="--i: 10;"><div class="ball"></div></div>
    </div>
</body>
</html>
