<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Tourist Card - Taj Mahal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto Condensed', sans-serif;
            background-color: #2c2c2c; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 350px;
            height: 450px;
            background-color: #fff; 
            border-radius: 8px;
            overflow: hidden; 
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }

        .card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-content {
            position: absolute;
            bottom: 0px; 
            left: 0;
            width: 100%;
            background-color: #fff;
            padding: 15px 25px;
            color: #333;
            transition: bottom 0.4s ease-in-out;
        }

        .card:hover .card-content {
            bottom: 0px; 
        }

        .card-content h2 {
            font-size: 1.8rem; 
            font-weight: 700;
            color: #40739e; 
            line-height: 1.2; 
            text-transform: uppercase; 
            letter-spacing: 1px;  
            transition: margin-bottom 0.3s ease-in-out 0.1s; 
        }

        .card:hover .card-content h2 {
            margin-bottom: 10px; 
        }

        .card-content p {
            font-size: 0.9rem;
            line-height: 1.5; 
            color: #333; 
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-in-out 0.1s, opacity 0.3s ease-in-out 0.1s;
        }

        .card:hover .card-content p {
            max-height: 150px; 
            opacity: 1;
        }

        .card-content a {
            font-size: 0.9rem;
            text-decoration: none;
            color: #40739e;
            font-weight: 400;
            display: block; 
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            margin-top: 0; 
            transition: max-height 0.4s ease-in-out 0.2s, opacity 0.3s ease-in-out 0.2s, margin-top 0.3s ease-in-out 0.2s;
        }

        .card:hover .card-content a {
            max-height: 20px; 
            opacity: 1;
            margin-top: 10px; 
        }

        .card-content a:hover {
            text-decoration: underline;
        }

        @media (max-width: 400px) {
            .card {
                width: 90vw;
            }
             .card-content {
                padding: 10px 15px;
               
            }
            .card-content h2 {
                font-size: 1.5rem;
            }
            .card-content p, .card-content a {
                font-size: 0.85rem;
            }
            .card:hover .card-content p {
                max-height: 90px; 
            }
             .card:hover .card-content a {
                max-height: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="./taj.jpeg" alt="Taj Mahal">
        <div class="card-content">
            <h2>Taj Mahal</h2>
            <p>
                Lorem, ipsum dolor sit amet consectetur adipisicing elit. Sit eveniet ipsam id deserunt
                debitis laboriosam omnis laborum, quaerat sunt, mollitia, enim vero numquam ratione inventore
                error pariatur cupiditate itaque nobis.
            </p>
            <a href="#">Read More</a>
        </div>
    </div>
</body>
</html>
