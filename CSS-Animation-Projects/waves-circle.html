<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wave Effect in CSS</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background-color: #1e272e;
        overflow: hidden;
      }

      .wave-container {
        width: min(500px, 80vmin);
        height: min(500px, 80vmin);
        position: relative;
        transform-style: preserve-3d;
        transform: perspective(800px) rotateX(60deg);
      }

      .wave-container div {
        position: absolute;
        display: block;
        border: 10px solid #fff;
        box-shadow: 0 8px 0 #ccc;
        border-radius: 50%;
        animation-name: wave-animation;
        animation-duration: 3s;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
        animation-delay: calc(var(--i) * 0.1s);
        top: calc(var(--i) * 10px);
        left: calc(var(--i) * 10px);
        bottom: calc(var(--i) * 10px);
        right: calc(var(--i) * 10px);
      }

      @keyframes wave-animation {
        0%,
        100% {
          transform: translateZ(-120px);
        }
        50% {
          transform: translateZ(120px);
        }
      }
    </style>
  </head>
  <body>
    <div class="wave-container">
      <div style="--i: 0"></div>
      <div style="--i: 1"></div>
      <div style="--i: 2"></div>
      <div style="--i: 3"></div>
      <div style="--i: 4"></div>
      <div style="--i: 5"></div>
      <div style="--i: 6"></div>
      <div style="--i: 7"></div>
      <div style="--i: 8"></div>
      <div style="--i: 9"></div>
      <div style="--i: 10"></div>
      <div style="--i: 11"></div>
      <div style="--i: 12"></div>
      <div style="--i: 13"></div>
      <div style="--i: 14"></div>
      <div style="--i: 15"></div>
      <div style="--i: 16"></div>
      <div style="--i: 17"></div>
      <div style="--i: 18"></div>
      <div style="--i: 19"></div>
    </div>
  </body>
</html>
