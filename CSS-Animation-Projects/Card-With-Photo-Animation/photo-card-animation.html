<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card With Photo Animation</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100%;
        height: 100vh;
        background-color: #222;
        display: grid;
        place-items: center;
        font-family: sans-serif;
        overflow: hidden;
      }

      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        max-width: 800px;
        width: 90%;
        max-height: 350px;
        height: 50vh;
        padding: 10px;
        cursor: pointer;
      }

      .container img {
        width: 30%;
        height: 100%;
        object-fit: cover;
        transform: perspective(800px) rotateY(25deg);
        transition: transform 0.5s, opacity 0.5s;
        border: 2px solid #fff;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      }

      .container:hover img {
        opacity: 0.5;
      }

      .container img:hover {
        transform: perspective(800px) rotateY(0deg) scale(1.2);
        opacity: 1;
        z-index: 99;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="./flower_1.jpg" alt="Red Roses in Vase" />
      <img src="./flower_2.jpg" alt="Pink Flowers and Coffee" />
      <img src="./flower_3.jpg" alt="Purple Flowers by Window" />
    </div>
  </body>
</html>
