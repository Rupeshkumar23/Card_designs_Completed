<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing Writing Effect</title>    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: sans-serif;
        background-color: #ffffff;
        color: #333;
        line-height: 1.6;
      }

      .container {
        height: 100vh;
        display: grid;
        place-items: center;
      }

      .typing-text {
        font-family: monospace;
        font-size: 3em;
        color: #192a56;
        border-right: 3px solid;
        width: 22ch;
        white-space: nowrap;
        overflow: hidden;
        animation: typing 3s steps(22), blink 0.5s step-end infinite alternate;
      }

      @keyframes typing {
        from {
          width: 0;
        }
      }

      @keyframes blink {
        50% {
          border-color: transparent;
        }
      }

      @media (min-width: 600px) {
        .typing-text {
          font-size: 4em;
        }
      }
      @media (min-width: 900px) {
        .typing-text {
          font-size: 5em;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="typing-text">This is a typing demo.</div>
    </div>
  </body>
</html>
