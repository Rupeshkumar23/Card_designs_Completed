<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Joe's Header 2</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f0f0;
        }

        header {
            background-color: #333;
            padding: 15px 0;
            color: #fff;
        }

        .header-container {
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #f97316;
            text-decoration: none;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 30px;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s ease;
        }
        nav ul li a:hover {
            color: #f97316;
            font-size: 16px;
        }

        nav ul li a.active {
            color: #f97316;
            font-weight: bold;
        }

        .cta-button {
            background-color: #f97316;
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            transition: background-color 0.2s ease;
        }

        .cta-button:hover {
             background-color: #ea580c;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="#" class="logo">TUTOR JOE'S</a>

            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Product</a></li>
                    <li><a href="#" class="active">About Us</a></li>
                    <li><a href="#">Download</a></li>
                </ul>
            </nav>

            <a href="#" class="cta-button">Call Us</a>
        </div>
    </header>
    

    <main>
    </main>
</body>
</html>
