<!DOCTYPE html>
<html>
  <head>
    <title>Course Card</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap");
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Roboto", sans-serif;
      }
      :root {
        --primary-color: #fc5648;
      }
      body {
        background-color: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .course-card {
        width: 750px;
        background-color: #ffffff;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        display: flex;
        overflow: hidden;
      }

      .card-left {
        background-color: var(--primary-color);
        color: #ffffff;
        padding: 30px;
        width: 35%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .card-right {
        padding: 30px;
        width: 65%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .label {
        font-size: 12px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 5px;
        color: #dcdde1;
      }

      .card-right .label {
        color: #888888;
      }

      .course-title {
        font-size: 30px;
        font-weight: bold;
        line-height: 1.2;
        margin-top: 10px;
      }

      .right-top-section {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 20px;
      }

      .chapter-title {
        font-size: 28px;
        font-weight: bold;
        color: #333333;
        line-height: 1.3;
        margin-top: -20px;
      }

      .right-bottom-section {
        display: flex;
        justify-content: flex-end;
        margin-top: 50px;
      }

      .continue-button {
        background-color: var(--primary-color);
        color: #ffffff;
        box-shadow: rgba(0, 0, 0, 0.4) 0px 20px 25px -5px,
          rgba(0, 0, 0, 0.04) 0px 10px 10px -5px;
        border: none;
        border-radius: 25px;
        padding: 15px 25px;
        font-size: 14px;
        letter-spacing: 1.5px;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }
      .continue-button:hover {
        background-color: #ff3320;
      }

      .view-chapters {
        color: #dcdde1;
        text-decoration: none;
        font-size: 13px;
        font-weight: bold;
        margin-top: 20px;
        align-self: flex-start;
      }

      .view-chapters:hover {
        text-decoration: underline;
      }

      .progress-area {
        text-align: right;
      }

      .progress-bar-container {
        width: 160px;
        height: 6px;
        background-color: #e0e0e0;
        border-radius: 4px;
        margin-bottom: 5px;
      }

      .progress-bar-filled {
        width: 50%;
        height: 100%;
        background-color: #ef5350;
        border-radius: 4px;
      }

      .progress-text {
        font-size: 11px;
        color: #888888;
        letter-spacing: 0.8px;
        text-transform: capitalize;
      }
    </style>
  </head>
  <body>
    <div class="course-card">
      <div class="card-left">
        <div>
          <span class="label">COURSE</span>
          <h2 class="course-title">JavaScript<br />Fundamentals</h2>
        </div>
        <a href="#" class="view-chapters">View all chapters ></a>
      </div>
      <div class="card-right">
        <div class="right-top-section">
          <div>
            <span class="label">CHAPTER 5</span>
          </div>
          <div class="progress-area">
            <div class="progress-bar-container">
              <div class="progress-bar-filled"></div>
            </div>
            <span class="progress-text">08/16 Challenges</span>
          </div>
        </div>

        <h3 class="chapter-title">Types Of Arrays & Strings</h3>

        <div class="right-bottom-section">
          <button class="continue-button">Continue</button>
        </div>
      </div>
    </div>
  </body>
</html>
