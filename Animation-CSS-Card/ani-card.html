<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated CSS Card - Zoom & Simple Hover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #ff6347;
            --white: #fff;
            --dark: #333;
        }

        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            font-family: "Roboto Condensed", sans-serif;
            background-color: var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--dark);
        }

        .card {
            background-color: var(--white);
            width: 550px;
            border-radius: 8px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.15);
        }

        .card-image-wrapper {
             overflow: hidden;
             border-top-left-radius: 8px;
             border-top-right-radius: 8px;
             line-height: 0px;
        }

        .card-image {
            display: block;
            width: 100%;
            height: 250px;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .card-image-wrapper:hover .card-image {
             transform: scale(1.2);
             cursor: pointer;
        }

        .card-content {
            padding: 25px;
        }

        .card-title {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 15px;
            font-weight: 400;
        }

        .card-text {
            font-size: 16px;
            line-height: 26px;
            margin-bottom: 20px;
            color: var(--dark);
        }

        .card-button {
            display: inline-block;
            padding: 10px 25px;
            border: 1px solid var(--primary);
            color: var(--primary);
            background-color: var(--white);
            text-decoration: none;
            border-radius: 4px;
            font-weight: 700;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .card-button:hover {
            background-color: var(--primary);
            color: var(--white);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-image-wrapper">
             <img src="./image.jpg" alt="Desk setup with keyboard, mouse, pencil, and ruler" class="card-image">
        </div>

        <div class="card-content">
            <h2 class="card-title">Is Apple a Design Company ?</h2>
            <p class="card-text">
                Lorem ipsum dolor sit amet consectetur, adipisicing elit. Consequatur, eos
                perferendis hic nam totam blanditiis ipsum. Odio saepe earum non soluta unde
                commodi nam illum.
            </p>
            <a href="#" class="card-button">Read More</a>
        </div>
    </div>
</body>
</html>
