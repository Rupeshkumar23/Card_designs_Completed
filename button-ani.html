<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Hover Effects</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto Condensed', sans-serif;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            min-height: 100vh;
            padding: 20px;
        }

        .btn {
            position: relative;
            z-index: 1;
            overflow: hidden;
            background: transparent;
            color: #d35400;
            border: 2px solid #d35400;
            padding: 15px 30px;
            margin: 20px;
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 5px;
            transition: color 0.5s ease-in-out;
        }

        .btn::before {
            content: '';
            position: absolute;
            background-color: #d35400;
            z-index: -1;
            transition: all 0.5s ease-in-out;
        }

        .btn-1::before {
            width: 100%;
            height: 0;
            top: unset;
            bottom: 0;
            left: 0;
        }
        .btn-1:hover::before {
            height: 100%;
        }

        .btn-2::before {
            width: 100%;
            height: 0;
            top: 0;
            left: 0;
            bottom: unset;
        }
        .btn-2:hover::before {
            height: 100%;
        }

        .btn-3::before {
            width: 0;
            height: 100%;
            top: 0;
            left: 0;
            right: unset;
        }
        .btn-3:hover::before {
            width: 100%;
        }

        .btn-4::before {
            width: 0;
            height: 100%;
            top: 0;
            right: 0;
            left: unset;
        }
        .btn-4:hover::before {
            width: 100%;
        }

        .btn-5::before,
        .btn-6::before,
        .btn-7::before,
        .btn-8::before {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .btn-5::before {
            width: 100%;
            height: 0;
        }
        .btn-5:hover::before {
            height: 100%;
        }

        .btn-6::before {
            width: 0;
            height: 100%;
        }
        .btn-6:hover::before {
            width: 100%;
        }

        .btn-7::before {
            width: 100%;
            height: 0;
            transform: translate(-50%, -50%) rotate(45deg);
        }
        .btn-7:hover::before {
            height: 380%;
        }

        .btn-8::before {
            width: 100%;
            height: 0;
            transform: translate(-50%, -50%) rotate(-45deg);
        }
        .btn-8:hover::before {
            height: 380%;
        }

        .btn:hover {
            color: #fff;
        }

    </style>
</head>
<body>
    <button class="btn btn-1">Button</button>
    <button class="btn btn-2">Button</button>
    <button class="btn btn-3">Button</button>
    <button class="btn btn-4">Button</button>
    <button class="btn btn-5">Button</button>
    <button class="btn btn-6">Button</button>
    <button class="btn btn-7">Button</button>
    <button class="btn btn-8">Button</button>
</body>
</html>
