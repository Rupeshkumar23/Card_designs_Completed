<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Component</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #4a4a4a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .calendar-container {
            width: 350px;
            background-color: #f0f0f0;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .selected-date-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 1px solid #e0e0e0;
        }

       .dropdown-toggle-button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 20px;
            height: 20px;
            background-color: #ffffff;
            border: none;
            cursor: pointer;
            box-shadow: 0px 3px 10px rgba(0, 0, 0, 0.08);
            transition: all 0.2s ease-in-out;
        }

        .dropdown-toggle-button:hover {
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            transform: translateY(-1px);
        }

        .dropdown-toggle-button:active {
            box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.08);
            transform: translateY(0px);
        }

        .chevron-icon {
            color: #555;
        }

        .month-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 15px 10px 15px;
            font-size: 15px;
            font-weight: 600;
        }

        .month-year {
            letter-spacing: 0.5px;
        }

        .nav-arrows button {
            background: none;
            border: none;
            font-size: 18px;
            color: #666;
            cursor: pointer;
            padding: 0 5px;
        }
        .nav-arrows button:hover {
            color: #333;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            padding: 0 15px 15px 15px;
            text-align: center;
        }

        .grid-item {
            padding: 8px 0;
            font-size: 13px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 34px;
            width: 100%;
        }

        .day-header {
            font-weight: 600;
            color: #555;
            font-size: 12px;
            height: auto;
            padding-bottom: 5px;
        }

        .date-cell {
            cursor: pointer;
            border-radius: 50%;
            width: 34px;
            margin: 0 auto;
        }

        .date-cell:hover {
            background-color: #e0e0e0;
        }

        .date-cell.today {
             background-color: #e9e9e9;
             font-weight: 500;
        }

        .date-cell.selected {
            background-color: #4a697c;
            color: #fff;
            font-weight: bold;
        }

        .date-cell.other-month {
            color: #b0b0b0;
            cursor: default;
        }
         .date-cell.other-month:hover {
             background-color: transparent;
         }

        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-top: 1px solid #e0e0e0;
            background-color: #f8f8f8;
        }

        .duration-selector {
            display: flex;
            align-items: center;
        }

        .duration-selector button {
            background-color: #e0e0e0;
            border: 1px solid #ccc;
            color: #333;
            font-size: 16px;
            font-weight: bold;
            width: 28px;
            height: 28px;
            line-height: 26px;
            text-align: center;
            cursor: pointer;
            border-radius: 4px;
        }
        .duration-selector button:hover {
            background-color: #d5d5d5;
        }

        .duration-selector span {
            margin: 0 12px;
            font-size: 14px;
            font-weight: 500;
            min-width: 50px;
            text-align: center;
        }

        .focus-button {
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .focus-button:hover {
             background-color: #f5f5f5;
        }

        .focus-button .play-icon {
           display: inline-block;
           width: 0;
           height: 0;
           border-top: 5px solid transparent;
           border-bottom: 5px solid transparent;
           border-left: 7px solid #333;
           margin-right: 6px;
        }

    </style>
</head>
<body>
    <div class="calendar-container">
        <div class="selected-date-bar">
            <span>Wednesday, 18 September</span>
            <button class="dropdown-toggle-button" aria-label="Toggle date options">
              <svg class="chevron-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
        </div>

        <div class="month-navigation">
            <span class="month-year">September, 2024</span>
            <div class="nav-arrows">
                <button title="Previous Month">▲</button>
                <button title="Next Month">▼</button>
            </div>
        </div>

        <div class="calendar-grid">
            <div class="grid-item day-header">Su</div>
            <div class="grid-item day-header">Mo</div>
            <div class="grid-item day-header">Tu</div>
            <div class="grid-item day-header">We</div>
            <div class="grid-item day-header">Th</div>
            <div class="grid-item day-header">Fr</div>
            <div class="grid-item day-header">Sa</div>

            <div class="grid-item date-cell">1</div>
            <div class="grid-item date-cell">2</div>
            <div class="grid-item date-cell">3</div>
            <div class="grid-item date-cell">4</div>
            <div class="grid-item date-cell today">5</div>
            <div class="grid-item date-cell">6</div>
            <div class="grid-item date-cell">7</div>

            <div class="grid-item date-cell">8</div>
            <div class="grid-item date-cell">9</div>
            <div class="grid-item date-cell">10</div>
            <div class="grid-item date-cell">11</div>
            <div class="grid-item date-cell">12</div>
            <div class="grid-item date-cell">13</div>
            <div class="grid-item date-cell">14</div>

            <div class="grid-item date-cell">15</div>
            <div class="grid-item date-cell">16</div>
            <div class="grid-item date-cell">17</div>
            <div class="grid-item date-cell selected">18</div>
            <div class="grid-item date-cell">19</div>
            <div class="grid-item date-cell">20</div>
            <div class="grid-item date-cell">21</div>

            <div class="grid-item date-cell">22</div>
            <div class="grid-item date-cell">23</div>
            <div class="grid-item date-cell">24</div>
            <div class="grid-item date-cell">25</div>
            <div class="grid-item date-cell">26</div>
            <div class="grid-item date-cell">27</div>
            <div class="grid-item date-cell">28</div>

            <div class="grid-item date-cell">29</div>
            <div class="grid-item date-cell">30</div>
            <div class="grid-item date-cell other-month">1</div>
            <div class="grid-item date-cell other-month">2</div>
            <div class="grid-item date-cell other-month">3</div>
            <div class="grid-item date-cell other-month">4</div>
            <div class="grid-item date-cell other-month">5</div>

            <div class="grid-item date-cell other-month">6</div>
            <div class="grid-item date-cell other-month">7</div>
            <div class="grid-item date-cell other-month">8</div>
            <div class="grid-item date-cell other-month">9</div>
            <div class="grid-item date-cell other-month">10</div>
            <div class="grid-item date-cell other-month">11</div>
            <div class="grid-item date-cell other-month">12</div>
        </div>

        <div class="bottom-bar">
            <div class="duration-selector">
                <button title="Decrease duration">-</button>
                <span>30 mins</span>
                <button title="Increase duration">+</button>
            </div>
            <button class="focus-button">
                <span class="play-icon"></span> Focus
            </button>
        </div>
    </div>
</body>
</html>
